name: Deploy static GDO-MT site

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gdo-mt-deploy
  cancel-in-progress: true

jobs:
  deploy-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site files
        run: |
          mkdir -p _site/assets _site/src/data _site/src/utils _site/src/config
          cp index.html _site/
          cp assets/app.css _site/assets/
          cp src/app.js _site/src/
          cp src/utils/formatters.js _site/src/utils/
          cp src/config/defaultSettings.js _site/src/config/
          cp src/data/departsSummary.js _site/src/data/
          cp src/data/dataRepository.js _site/src/data/
          cp src/data/tableSchemas.js _site/src/data/
          cp src/data/networkData.js _site/src/data/
          cp src/data/fullTablesData.js _site/src/data/

      - name: Publish static files to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
