<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Connexion — GDO-MT</title>
    <meta name="description" content="Accès à la plateforme GDO-MT." />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; }
      body.login-mode { display: grid; place-items: center; padding: 20px; background: linear-gradient(145deg, #eaf0f7 0%, #f8fafc 55%, #e8eef5 100%); }
      #root { width: 100%; min-width: 0; }
      .login-card { width: min(100%, 390px); background: #fff; border: 1px solid #dbeafe; border-radius: 18px; padding: 32px 28px; box-shadow: 0 24px 70px #0006; }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
      .brand-mark { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; color: white; font-weight: 900; background: linear-gradient(135deg,#2563eb,#1e40af); letter-spacing: .04em; }
      .login-card h1 { font-size: 22px; margin: 0; color: #0f172a; }
      .subtitle { margin: 5px 0 0; font-size: 12px; color: #64748b; }
      .login-card label { display: block; margin: 0 0 8px; font-size: 13px; font-weight: 700; color: #334155; }
      .login-card input { width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; padding: 13px 14px; font-size: 16px; outline: none; }
      .login-card input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px #2563eb22; }
      .login-card button { width: 100%; border: 0; border-radius: 10px; padding: 13px; margin-top: 16px; color: #fff; background: #1d4ed8; font-size: 14px; font-weight: 700; cursor: pointer; }
      .login-card button:hover { background: #1e40af; }
      .login-card button:disabled { opacity: .65; cursor: wait; }
      #login-error { min-height: 18px; margin: 12px 0 0; color: #b91c1c; font-size: 12px; font-weight: 600; }
      .footer { margin-top: 20px; text-align: center; color: #94a3b8; font-size: 11px; }

    </style>
  </head>
  <body class="login-mode">
    <main id="login-panel" class="login-card">
      <div class="brand">
        <div class="brand-mark">GDO</div>
        <div>
          <h1>GDO-MT</h1>
          <p class="subtitle">Gestion des ouvrages Moyenne Tension</p>
        </div>
      </div>
      <form id="login-form">
        <label for="access-password">Mot de passe d'accès</label>
        <input id="access-password" type="password" autocomplete="current-password" placeholder="Saisir le mot de passe" required autofocus />
        <button id="login-submit" type="submit">Accéder à la plateforme</button>
        <p id="login-error" role="alert" aria-live="polite"></p>
      </form>
      <div class="footer">Accès réservé aux utilisateurs autorisés</div>
    </main>
    <div id="root"></div>
    <script>
      (() => {
        const PASSWORD_SHA256 = "f2593099ee4ccfc6d97af8ff7a5fe5e3c68ed25c3b044a58f0bba4f7c7bea469";
        const SESSION_KEY = "gdo_mt_authenticated";
        const panel = document.getElementById("login-panel");
        const form = document.getElementById("login-form");
        const input = document.getElementById("access-password");
        const submit = document.getElementById("login-submit");
        const error = document.getElementById("login-error");

        async function sha256(value) {
          const bytes = new TextEncoder().encode(value);
          const digest = await crypto.subtle.digest("SHA-256", bytes);
          return Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, "0")).join("");
        }

        async function openApplication() {
          panel.hidden = true;
          document.body.classList.remove("login-mode");
          document.body.style.display = "block";
          document.body.style.padding = "0";
          document.body.style.background = "#f2f7f8";
          document.title = "GDO-MT — Gestion des ouvrages Moyenne Tension";
          const stylesheet = document.createElement("link");
          stylesheet.rel = "stylesheet";
          stylesheet.href = "./assets/app.css";
          document.head.appendChild(stylesheet);

          try {
            await import("./src/app.js");
          } catch (loadError) {
            console.error("Erreur de chargement de GDO-MT :", loadError);
            logout.remove();
            panel.hidden = false;
            error.textContent = "Impossible de charger la plateforme. Actualisez la page.";
          }
        }

        form.addEventListener("submit", async event => {
          event.preventDefault();
          error.textContent = "";
          submit.disabled = true;
          submit.textContent = "Vérification…";
          try {
            if (await sha256(input.value) === PASSWORD_SHA256) {
              sessionStorage.setItem(SESSION_KEY, "1");
              await openApplication();
            } else {
              error.textContent = "Mot de passe incorrect.";
              input.value = "";
              input.focus();
            }
          } catch (authError) {
            console.error("Erreur d'authentification :", authError);
            error.textContent = "La vérification a échoué. Réessayez.";
          } finally {
            submit.disabled = false;
            submit.textContent = "Accéder à la plateforme";
          }
        });

        if (sessionStorage.getItem(SESSION_KEY) === "1") {
          void openApplication();
        }
      })();
    </script>
  </body>
</html>
